[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tris-haslam-cal"
version = "0.1.0"
description = "TRIS map-making (limTOD) and the TRIS-anchored spectral model of the Haslam 408 MHz map"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Sohini Dutta" }]

dependencies = [
    # limTOD: the code needs the source checkout at ../limTOD (github.com/zzhang0123/limTOD, commit dbe720b),
    # which has changes the PyPI release does not; see environment.yml. Do not install this package with pip.
    "limTOD>=1.10.0",
    "numpy>=1.24",
    "scipy>=1.15",
    "healpy>=1.16",
    "astropy>=5.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "tqdm>=4.60",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "jupyterlab", "ipykernel"]

# No console-script entry point: run_pipeline.py at the repo root is the single entry point.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
