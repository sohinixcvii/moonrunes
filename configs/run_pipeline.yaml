# =============================================================================
# moonrunes -- the run configuration (data, beam, ring, pipeline)
# =============================================================================
# Every choice the analysis depends on lives here, with the reason next to it.
# The model-comparison settings (models, priors, sampler, error bars) are in
# configs/model_comp_config.yaml; no setting is in both.  Each step's manifest
# records the exact block it used.
#
# Fields marked DECISION are deliberate choices.  A null that is an open
# decision makes the stage that needs it raise rather than default.
# =============================================================================

run:
  name: tris_haslam_v0
  outputs_dir: outputs            # relative to repo root; gitignored
  seed: 20260903                  # every np.random.default_rng in the pipeline
  overwrite: true                # stages refuse to clobber existing products

paths:
  # docs/DATA_SOURCES.md describes every dataset below and what reads it.
  #
  # The TRIS archive products (the four public LAMBDA text files).
  tris_archive_dir: ../limTOD/downloads/TRIS
  # Haslam 408 MHz and ARCADE 2 as read by `run_pipeline.py --stage 2` (the beam
  # matching needs the files themselves, to read their beam keywords).
  haslam_map_fits: res/HASLAM.fits
  arcade2_map_3150: res/ARCADE2_315.fits
  arcade2_map_3410: res/ARCADE2_341.fits
  # The limTOD source checkout (github.com/zzhang0123/limTOD, commit dbe720b), which
  # has changes to limTOD.tris that the PyPI release does not.  Stage 1 imports an
  # installed limTOD if there is one and falls back to this path, so do not install it.
  limtod: ../limTOD

# -----------------------------------------------------------------------------
# TRIS beam.  HPBW 19.155 deg (E-plane) / 23.366 deg (H-plane), from the
# archive's own cuts; stage 1 builds the beam from those cuts.  beam_deg is the
# arithmetic mean of the two planes, recorded in the stage 1 manifest.
# -----------------------------------------------------------------------------
beam:
  e_plane_hpbw_deg: 19.155        # archive-confirmed
  h_plane_hpbw_deg: 23.366        # archive-confirmed
  beam_deg: 21.2605               # DECISION: mean of E/H
  nside_new: 16                   # DECISION: pinned, not inferred: the working grid
                                  # (= tris.nside; stage 2 regrids onto it)
  pixels_per_fwhm: 2.73           # pixels per beam FWHM; recorded in the stage 1
                                  # manifest only, nothing uses it
  selfrot_deg: -7.0               # E-plane roll east of meridian (geometry owns
                                  # it -- do NOT pre-rotate the beam map)
  apply_horizon_mask: true        # cut beam has ~1.2e-4 of its power below the
                                  # horizon, ~0.035 K against 300 K ground

# -----------------------------------------------------------------------------
# Stage 1 -- TRIS map-making (limTOD.tris)
# -----------------------------------------------------------------------------
tris:
  # 2.5 GHz dropped: flagged poor quality in the TRIS literature review.
  frequencies_mhz: [600, 820]     # DECISION
  # Absolute-calibration reference.  600 MHz has the better-quantified absolute
  # calibration in the literature review, so it anchors the spectral model.
  ref_freq_mhz: 600               # DECISION
  # DECISION: the prior-regularized map-maker (a Wiener filter with an external
  # prior), not limTOD's beam-width binning scheme, which is not wired up here.
  mapmaker: prior_regularized
  # DECISION -- this is SUPPOSED to be a coarse map.  The beam is 19-23 deg,
  # so nside 16 (3.7 deg pixels) is already ~6x finer than the resolution
  # behind it.  The whole analysis works on nside 16 (beam.nside_new = 16).
  # nside 64 (0.92 deg pixels) would ask the solver for 25705 free parameters
  # from 120 samples carrying ~15 independent numbers, and is more than limTOD's
  # dense solver can fit in memory.
  nside: 16
  # DECISION -- pixel selection is on BEAM RESPONSE, not on a declination
  # band.  A pixel is retained if the beam response at it exceeds this
  # fraction of the peak response for at least one observation.  That is the
  # physical statement -- keep what the horn actually saw -- where a band cut
  # is only a proxy for it, keeping pixels the beam never illuminated and
  # cutting wing pixels it did.
  #
  # Convergence was checked at 0.003 / 0.01 / 0.03: the maps agree to 0.4 sigma,
  # the zero level moves by ~0.1 K (docs/TRIS_MAP_PROVENANCE.md).
  beam_response_threshold: 0.01
  # The prior-regularized map-maker has a known zero-level/monopole degeneracy.
  # A finite zero-level sigma is what breaks it; null leaves it degenerate.
  zero_level_sigma_k: 0.5         # DECISION -- K, see notebooks/diagnostics.ipynb Part A.  One value
                                  # for both rings: the archive quotes 0.066 K
                                  # at 600 MHz and an ASYMMETRIC +0.430/-0.300 K
                                  # at 820 MHz, and limTOD deliberately refuses
                                  # to symmetrise it.  0.5 K covers
                                  # both without pretending to a precision the
                                  # 820 MHz ring does not have.
  # Each published ring contains exactly one row with a 0.000 K statistical
  # error, so a floor is mandatory.  null -> use that ring's smallest strictly
  # positive statistical error (what the walkthrough notebook does).
  uncertainty_floor_k: null
  # Grid limTOD rotates the beam on before projecting it onto the `nside` map
  # pixels.  Must be >= nside.  limTOD draws the beam itself at `nside` (it calls
  # tris_cut_beam_map with the map nside) and only up-samples it to this grid.
  # DECISION: 16, so everything runs at nside 16.  Its measured
  # cost at nside 16: with 64 the fit gives reduced chi2 3.09 / 3.22 and the
  # data tighten 388 / 201 pixels by >5%; with 16 it is 16.1 / 5.9 and 23 / 7.
  nside_hires: 16

  # Prior for the prior-regularized map-maker.  There is no truth for real
  # data, so GSM2008 stands in as BOTH the
  # template and the reference "true" sky.  That is circular by construction:
  # stage 1 records `prior_equals_truth` in its manifest so nothing downstream
  # can read agreement with GSM2008 as a measurement.  The walkthrough notebook
  # measured GSM2008 as ~1.9 K cold at 600 MHz and ~0.6 K cold at 820 MHz, so
  # the fitted zero level absorbs a real model offset -- read it as a
  # model-mismatch amplitude, not as the archive's zero point.
  prior:
    template: gsm2008             # DECISION -- pygdsm GlobalSkyModel (2008)
    relative_sigma: 0.10          # "trust the template to 10% of local sky"
    absolute_sigma_k: 0.3         # flat term added in quadrature, K
    floor_sigma_k: 1.0e-3         # keeps the prior off a delta function

  # Stage 1's MAP operator (A^T N^-1 A + P^-1) is SPD, so cg is also valid; the
  # recorded decision is gmres.
  solver:
    # DECISION -- the solve is limTOD's own: TRISMapMakingInputs.solve, which
    # wraps limTOD.wiener_filter_map.  It forms the dense normal matrix and
    # factorises it directly, so there is no iterative tolerance to set; the
    # in-repo Krylov path (krylov_map_solve) is only the test suite's
    # reference implementation.
    #
    # Added to the diagonal of the normal matrix before inversion, to keep it
    # invertible.  It is a bias on the answer as well as a numerical guard, so
    # it stays as small as the conditioning allows.
    regularization: 1.0e-12
    # The in-repo Krylov reference solver's method (tests, and the cross-check below).
    method: gmres
    # 1e-12, not the 1e-9 used elsewhere: the residual norm is a poor proxy for
    # solution accuracy here because the prior width spans an order of
    # magnitude across the band, so a 1e-9 residual leaves the map ~1e-3
    # posterior sigma off.  1e-12 gets it to ~5e-7 sigma.
    rtol: 1.0e-12
    maxiter: 1000
    # gmres restart length.  null -> n_samples + 40.  The data term has rank
    # n_samples (120), so a restart longer than that lets gmres terminate
    # inside one cycle instead of stalling at the default restart of 20.
    restart: null
    # Cross-check limTOD's answer against an exact reference solve
    # (npix x npix -> n_samples x n_samples, exact).  This is the "did it actually converge" test, not "did it finish".
    # DECISION -- OFF: with false, the reference is not computed, nothing can stop
    # the run, and the manifest records the comparison as null; the maps are
    # limTOD's answer, unverified.  Set true to switch it on (when last on, it
    # agreed to ~1e-10 sigma).  The TOD route (steps 2-7) does not use the maps.
    cross_check: false
    # Used only when cross_check is true.  Measured in posterior sigma, which is
    # the unit in which a solver error either matters or does not.
    cross_check_max_sigma: 1.0e-4


# -----------------------------------------------------------------------------
# Beam matching of a map to the TRIS beam, frame and grid (stage 2, and the
# map route).  An SED is only meaningful if every point in it came through the
# same beam.  TRIS is the coarsest, so it sets the target and every other map is
# smoothed down to it.  The pipeline's kernel is pipeline.beam_match_kernel.
# -----------------------------------------------------------------------------
beam_matching:
  # DECISION -- circular_gaussian for stage 2 and the map route.  The pipeline uses
  # tris_cuts (pipeline.beam_match_kernel, sed.tod_beam); both elliptical kernels
  # are tested in scripts/tests/test_elliptical_beam.py and tests_analysis Part K2.
  # The SHAPE of the TRIS beam a map is smoothed to (moonrunes.elliptical_beam
  # explains the elliptical ones):
  #   tris_cuts           the measured beam: the archive E/H cuts, blended with
  #                       cos^2/sin^2 weights -- the same beam limTOD uses for
  #                       the TOD route and stage 1.  Elliptical (19.155 x 23.366)
  #                       and with its real shoulders.
  #   elliptical_gaussian a Gaussian with the same two widths and orientation.
  #   circular_gaussian   a simplification: hp.smoothing at
  #                       target_fwhm_deg (the larger axis), 22% too wide on E.
  # The elliptical kernels are applied as a direct sum on the sphere, because
  # hp.smoothing can only apply a kernel that is the same in every direction.
  kernel: circular_gaussian
  # Used by kernel = circular_gaussian (the current choice): the larger of TRIS's two axes
  # (19.155 E / 23.366 H).  One symmetric FWHM cannot carry the elliptical beam;
  # the larger axis leaves nothing under-smoothed in the narrow direction.
  target_fwhm_deg: 23.366
  # Used only by the elliptical kernels.
  elliptical:
    # The TRIS half-power widths, from the archive's own cuts
    # (TRISPrincipalPlaneCuts.half_power_full_width_deg; tests_analysis Part K1 tests them).
    # For tris_cuts these must match the cuts to 0.001 deg or the run stops.
    fwhm_e_deg: 19.155
    fwhm_h_deg: 23.366
    # Orientation on the sky.  TRIS points at the zenith; its E plane lies along
    # the meridian, rolled 7 deg EAST of it (TRIS_Beam_Profile.txt, both ring
    # headers, limTOD TRIS_E_PLANE_EAST_OF_MERIDIAN_DEG).  At the zenith the
    # meridian is the hour circle, so: E plane at position angle +7 deg
    # (north through east), H plane at +97 deg (east-west).
    e_plane_east_of_meridian_deg: 7.0
    # The horn sees ground, not sky, below the horizon: at the zenith that is
    # more than 90 deg from boresight.  The kernel is zero beyond this (as limTOD's
    # tris_horizon_mask does for the TOD route).  Only matters for tris_cuts,
    # whose archive floor is ~-60 dB out to 176 deg.
    horizon_deg: 90.0
    # limTOD's interpolation between the E and H cuts at intermediate azimuth:
    # "db" (default, the standard horn construction) or "power".
    blend: db
    # The grid the direct sum runs over.  64 = 0.92 deg pixels, 20x finer than
    # the 19 deg beam (tests_analysis Part K1, Test 2: a beam map at 64 reproduces the
    # widths to 0.07%).  128 is 4x slower and needs a smaller chunk.
    nside_work: 64
    # Points per output pixel, per side (a power of 2): 2 = 4 points averaged,
    # so each output value is a pixel average, like the circular path's
    # all_children regrid.  1 = the pixel centre only (4x faster, no pixel window).
    eval_subdivision: 2
    # A survey's own beam widens the result.  If convolving the cut beam with it
    # widens the narrow E axis by at most this fraction, it is neglected and the
    # kernel is the cut beam itself.  0.002 (0.2%) = native beams up to ~1.2 deg:
    # Haslam (0.93 deg, +0.12%), Stockert, CHIPASS, Rhodes.  NOT LWA1 35/80 MHz
    # (4.65/2.04 deg), Maipu (4.6 deg) or ARCADE 2 (11.6 deg).
    max_broadening_fraction: 0.002
    # For those broader beams there is no exact "subtract the native beam" for
    # the cut beam.  scaled_cuts: the cut beam compressed in angle along E and H
    # to the quadrature widths sqrt(target^2 - native^2), so the core comes back
    # to 19.155 x 23.366 and the shoulders keep the measured shape, approximately.
    # elliptical_gaussian: the per-axis quadrature Gaussian (exact core,
    # Gaussian shoulders).  tests_analysis Part K2 compares the two.
    broad_native_kernel: scaled_cuts
    # Evaluation points handled per matrix product.  Memory ~ chunk x 12 x
    # npix(nside_work) x 8 bytes: ~600 MB at 128 and nside_work 64.
    chunk: 128
  # Haslam: BEAMSIZE = 56.0 in HDU 1 of the FITS file, in ARCMINUTES.
  haslam_native_fwhm_deg: 0.93333
  # 11.6 deg, as both ARCADE 2 headers state (BEAMSZ, HDU 0), and as LAMBDA and
  # Singal et al. 2011 give.
  arcade2_native_fwhm_deg: 11.6
  # Below this smoothed (observed) weight a pixel is mask boundary, not data.
  # Stage 2 also drops any pixel that passes the floor but was never observed.
  weight_floor: 0.5
  # DECISION -- how a map finer than beam.nside_new is averaged onto it.
  # "all_children": a coarse pixel gets a value only if every one of its
  # sub-pixels was observed, so no value mixes observed and unobserved sky.
  # Everything is put on the TRIS grid (beam.nside_new must equal tris.nside).
  coarse_pixel_rule: all_children

# -----------------------------------------------------------------------------
# The SED inputs (moonrunes.sed_prototype): which maps, and how a map becomes a ring TOD
# -----------------------------------------------------------------------------
sed:
  # DECISION -- maps left out of every fit and of the T-T analysis.  ARCADE 2 covers ~7%
  # of the sky as a thin ring; on the TRIS ring it has data at only 16-17 of 120 samples,
  # and its very small calibration errors (6-7.5 mK) let those few points pull the fits
  # (steps along the ring at LST 255-280 and 320-345 deg).  The Juno maps have no stated
  # unit, frame, beam or provenance.  Filenames as in res/.  Stage 2 is not affected.
  # With this list step 3 gets 11 points per ring sample and step 5 gets 13.
  exclude_maps: [ARCADE2_315.fits, ARCADE2_341.fits, Juno_1248MHz.fits, Juno_600MHz.fits]
  # DECISION -- how every map becomes a TRIS ring TOD (sed_prototype.Inputs.ring_tod;
  # the pipeline, run_comparison.py, the notebooks).
  #   beam_matched  stage 2's beam matching with the tris_cuts kernel (beam_matching.elliptical),
  #                 evaluated at the 120 ring pointings on the nside_work grid: the TRIS cut beam
  #                 with each map's own beam taken out (scaled_cuts for natives above ~1.2 deg),
  #                 so every TOD sees the TRIS beam once, as the TRIS ring data do.
  #   native        the map at its own resolution, degraded to tris.nside and
  #                 observed with limTOD's TRIS beam, so the map's own beam stays in on top.
  tod_beam: beam_matched

# -----------------------------------------------------------------------------
# The end-to-end pipeline (src/moonrunes/pipeline.py; `python run_pipeline.py --step all`).
# Steps: 0 tris_maps, 1 beam_match, 2 ring_tods, 3 compare, 4 select, 5 fit, 6 predict_408, 7 rhino.
# The data are every map in res/ that sed.exclude_maps leaves in, plus TRIS; Haslam (target_file) is never a
# fit point.  Models, priors, the UltraNest sampler, the error bars and what the comparison is decided on
# (statistic, TRIS excluded) come from configs/model_comp_config.yaml.
# -----------------------------------------------------------------------------
pipeline:
  output_dir: paper_outputs/pipeline        # one folder per step; step 0 writes to run.outputs_dir (outputs/stage1)
  model_comparison_config: configs/model_comp_config.yaml
  # The Haslam map: predicted in step 6, never fitted.  The one place this is set (also read by run_comparison.py
  # and the notebooks).
  target_file: HASLAM_DESTRIPED_ONLY.fits
  # Step 1: the kernel the maps are beam-matched with.  The ring TODs (step 2) always use tris_cuts at the ring
  # pointings (sed.tod_beam: beam_matched); tris_cuts here keeps the step 1 maps on the same beam.
  # (beam_matching.kernel, used by stage 2 and the map route, is left as it is.)
  beam_match_kernel: tris_cuts
  compare:
    # what is compared (statistic) and whether TRIS is left out (exclude_tris): model_comp_config.yaml comparison
    seed: 20260903                          # numpy's global RNG (UltraNest), seed + ring sample index
  select:
    # The highest ln Z summed over the ring samples wins; a model within tie_lnz of it with fewer
    # parameters is preferred.  (With compare.statistic: max_likelihood, the summed BIC is used instead.)
    tie_lnz: 1.0
  fit:
    seed: 12345                             # seed + ring sample index
  predict_408:
    cygnus_ra_deg: 299.9
    cygnus_half_width_deg: 25.0             # the scale-offset fit is also made without these samples
  sky_models:                               # the comparison sky models (steps 2, 6, 7)
    native_fwhm_deg: {GSM2008: 1.0, GSM2016: 0.8, LFSM: 5.1}
    carter: {scale: 1.029, offset_k: 0.91}  # Carter et al. 2025, on the CMB-removed 408 MHz map
    irfan_monopole_k: 8.9                   # Irfan & Puglisi 2025 (CMB included in the 8.9 K)
    # Off 408 MHz the Irfan correction is carried with Irfan & Puglisi 2025's own synchrotron spectrum (their
    # eqs. 1, 2, 6, 11; pipeline.irfan_scaling): T(p, nu) = (T_tot - 8.9 K)(p, 408) * S(p, nu) / S(p, 408), with
    # S(p, nu) = (nu/nu0)^(beta_s(p) + c_s(p) ln(nu/nu0)), nu0 = 45 MHz.  The maps: HEALPix nside 256, RING,
    # Galactic (frame checked: their small-scale structure correlates with Haslam's at +0.23 read as Galactic,
    # +0.02 as equatorial).  Licence not cleared with the authors: do not redistribute the maps.
    irfan_nu0_mhz: 45.0
    irfan_beta_map: external/irfan_puglisi_2025/final_beta_1deg.npy
    irfan_cs_map: external/irfan_puglisi_2025/final_cs_1deg.npy
    ginan_freq_mhz: 350.0                   # McKay et al. 2025, top of the valid range
    lfsm_beta_from_mhz: 300.0               # LFSM extended above 408 MHz with its own 300-408 MHz index
  rhino:
    freqs_mhz: [60.0, 65.0, 70.0, 75.0, 80.0]
    beam_file: ../rhino-beams/npz_beams/DryHornGround.npz       # outside this repo
    horizon_file: ../rhino-beams/horizon_masks/JodrellBank.fits # outside this repo
    latitude_deg: 53.235002                 # Jodrell Bank, horn at the zenith
    deconvolution_prior: GSM2016
    sky_models: ["GSM2008", "GSM2016", "LFSM", "GSM2008, Carter correction", "GSM2008, Irfan correction",
                 "GSM2016, GINAN correction"]
