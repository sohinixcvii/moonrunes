# =============================================================================
# tris_haslam_cal -- single source of truth
# =============================================================================
# Every decision the gameplan (tris_haslam_pipeline.md) flagged as "decide
# rather than default" lives here, with the decision written down and the
# reason next to it.  Nothing downstream may hard-code any of these values:
# stages read this file, and stage manifests record the exact block they used.
#
# Fields marked DECISION are the flagged ones.  Fields marked OPEN still need a
# human choice before the stage that consumes them can run; the stage raises
# rather than defaulting.
# =============================================================================

run:
  name: tris_haslam_v0
  outputs_dir: outputs            # relative to repo root; gitignored
  seed: 20260903                  # every np.random.default_rng in the pipeline
  overwrite: false                # stages refuse to clobber existing products

paths:
  # Raw TRIS archive products (the four public LAMBDA text files).  Point this
  # at the local download; nothing here touches the network.
  tris_archive_dir: ../limTOD/downloads/TRIS
  # Reprocessed Haslam 408 MHz map (FITS).  null is NOT an open decision here:
  # it means "use the destriped/desourced Remazeilles (2015) map that pygdsm
  # already caches" (haslam408_dsds_Remazeilles2014.fits), which is the
  # reprocessed map stage 2 wants.  Set this to override with a local file.
  haslam_map: null
  # Berkhuijsen (1972) 820 MHz survey, the only genuinely Haslam-independent
  # prior basis.  Required only when haslam.prior.source = berkhuijsen_1972.
  berkhuijsen_map: null
  # bayesian_skymap checkout (the patched fork, as a submodule).
  bayesian_skymap: external/bayesian_skymap
  # limTOD checkout.  limTOD is a normal pip dependency (pyproject), but the
  # sibling source checkout is what the walkthrough notebook uses and is what
  # gets picked up when the environment has no installed copy.  Stage 1 imports
  # the installed package if there is one and falls back to this path.
  limtod: ../limTOD

# -----------------------------------------------------------------------------
# Blocker 1 -- beam width.  RESOLVED: the fork carries the beam-flexibility
# patch (bayesian_func.resolve_nside_new / nside_for_beam), so beam_deg is no
# longer restricted to {10, 30} and the TRIS beam is passed through as itself.
#
# TRIS HPBW: 19.155 deg (E-plane) / 23.366 deg (H-plane).  beam_deg below is
# the arithmetic mean of the two principal planes -- bayesian_skymap's forward
# model is azimuthally symmetric (hp.smoothing with a single fwhm), so an
# asymmetric beam cannot be represented and the mean is the honest summary.
# The E/H asymmetry itself is carried properly in stage 1, where limTOD builds
# the beam from the archive's own cuts; it is only the *recalibration* forward
# model that symmetrises.
#
# Worth knowing: at pixels_per_fwhm = 2.73 the heuristic maps 21.26 deg to
# nside_new = 8 -- the same grid the 30 deg fallback would have given
# (nside 8 pixel = 7.33 deg <= 21.26/2.73 = 7.79 deg; nside 16 = 3.66 deg is
# finer than needed).  So the patch does not change the grid; what it changes
# is that the beam actually used to forward-model the TRIS map is 21.26 deg
# instead of 30 deg.  That is the mismatch it removes.
# -----------------------------------------------------------------------------
beam:
  e_plane_hpbw_deg: 19.155        # archive-confirmed
  h_plane_hpbw_deg: 23.366        # archive-confirmed
  beam_deg: 21.2605               # DECISION: mean of E/H, passed to --beam-deg
  nside_new: 8                    # DECISION: pinned, not inferred, so the grid
                                  # cannot move under us if the heuristic's
                                  # PIXELS_PER_FWHM convention is ever retuned.
                                  # Must equal nside_for_beam(beam_deg) = 8.
  pixels_per_fwhm: 2.73           # bayesian_skymap's convention; recorded only
  selfrot_deg: -7.0               # E-plane roll east of meridian (geometry owns
                                  # it -- do NOT pre-rotate the beam map)
  apply_horizon_mask: true        # cut beam has ~1.2e-4 of its power below the
                                  # horizon, ~0.035 K against 300 K ground

# -----------------------------------------------------------------------------
# Stage 1 -- TRIS map-making (limTOD.tris)
# -----------------------------------------------------------------------------
tris:
  # 2.5 GHz dropped: flagged poor quality in the TRIS literature review.
  frequencies_mhz: [600, 820]     # DECISION
  # Absolute-calibration reference.  600 MHz has the better-quantified absolute
  # calibration in the literature review, so it anchors the spectral model.
  ref_freq_mhz: 600               # DECISION
  # DECISION (gameplan stage 1.4): the prior-regularized map-maker, not the
  # beam-width binning scheme -- it is the one built to consume an external
  # prior, which is exactly what the Berkhuijsen prior below is for.
  # Allowed: "prior_regularized" | "beamwidth_binning"
  mapmaker: prior_regularized
  nside: 64                       # working nside for the TRIS ring solve; the
                                  # map is degraded to beam.nside_new in stage 3
  dec_half_width_deg: 45.0        # ring pixel selection half-width
  # The prior-regularized map-maker has a known zero-level/monopole degeneracy.
  # A finite zero-level sigma is what breaks it; null leaves it degenerate.
  zero_level_sigma_k: 0.5         # DECISION -- K, see notebooks/01.  One value
                                  # for both rings: the archive quotes 0.066 K
                                  # at 600 MHz and an ASYMMETRIC +0.430/-0.300 K
                                  # at 820 MHz, and limTOD deliberately refuses
                                  # to symmetrise that for you.  0.5 K covers
                                  # both without pretending to a precision the
                                  # 820 MHz ring does not have.
  # Each published ring contains exactly one row with a 0.000 K statistical
  # error, so a floor is mandatory.  null -> use that ring's smallest strictly
  # positive statistical error (what the walkthrough notebook does).
  uncertainty_floor_k: null
  # Resolution at which the beam is rotated before being sampled onto the
  # `nside` grid.  Must be >= nside; equal to it is correct here because the
  # cut-built beam is already well sampled at nside 64 (0.92 deg pixels for a
  # 19 deg FWHM).
  nside_hires: 64

  # Prior for the prior-regularized map-maker.  Blocker 2 has no truth for real
  # data and Berkhuijsen is not in hand yet, so GSM2008 stands in as BOTH the
  # template and the reference "true" sky.  That is circular by construction:
  # stage 1 records `prior_equals_truth` in its manifest so nothing downstream
  # can read agreement with GSM2008 as a measurement.  The walkthrough notebook
  # measured GSM2008 as ~1.9 K cold at 600 MHz and ~0.6 K cold at 820 MHz, so
  # the fitted zero level absorbs a real model offset -- read it as a
  # model-mismatch amplitude, not as the archive's zero point.
  prior:
    template: gsm2008             # DECISION -- pygdsm GlobalSkyModel (2008)
    relative_sigma: 0.10          # "trust the template to 10% of local sky"
    absolute_sigma_k: 0.3         # flat term added in quadrature, K
    floor_sigma_k: 1.0e-3         # keeps the prior off a delta function

  # Blocker 3 says never the Woodbury fast path -- use the direct Krylov solve.
  # Stage 1's MAP operator (A^T N^-1 A + P^-1) is SPD, so cg is also valid; the
  # recorded decision is gmres, matching stage 4.
  solver:
    method: gmres                 # DECISION -- gmres | cg | bicgstab
    # 1e-12, not the 1e-9 used elsewhere: the residual norm is a poor proxy for
    # solution accuracy here because the prior width spans an order of
    # magnitude across the band, so a 1e-9 residual leaves the map ~1e-3
    # posterior sigma off.  1e-12 gets it to ~5e-7 sigma.
    rtol: 1.0e-12
    maxiter: 1000
    # gmres restart length.  null -> n_samples + 40.  The data term has rank
    # n_samples (120), so a restart longer than that lets gmres terminate
    # inside one cycle instead of stalling at the default restart of 20.
    restart: null
    # Cross-check the Krylov answer against the exact Woodbury identity
    # (npix x npix -> n_samples x n_samples, exact, not the Blocker 3 fast
    # path).  This is the "did it actually converge" test, not "did it finish".
    cross_check: true
    # Measured in posterior sigma, which is the unit in which a solver error
    # either matters or does not.  gmres at rtol 1e-12 lands at ~5e-7.
    cross_check_max_sigma: 1.0e-4

# -----------------------------------------------------------------------------
# Stage 2 -- Haslam prep + gain operator + prior
# -----------------------------------------------------------------------------
haslam:
  nside: 128                      # bayesian_skymap's fixed full-resolution grid
  # DECISION -- common coordinate frame for everything from here on.  Haslam is
  # natively galactic and stays that way (no rotation of the high-resolution
  # map); the gain and beta regions are galactic latitude bands, which is what
  # bayesian_skymap's own region_operator assumes and what is physical for
  # synchrotron beta.  Stage 3 rotates stage 1's equatorial TRIS band into this
  # frame, and the ragged result is carried by pixel_mask.
  frame: galactic
  # Haslam is a total-intensity map; bayesian_skymap models sky_gain as a pure
  # power law with no monopole, so the CMB monopole has to come off first.  The
  # Rayleigh-Jeans value at 408 MHz (2.7157 K) is used, not the thermodynamic
  # 2.7255 K, because stage 1 established that this pipeline works in RJ.
  # pygdsm subtracts a flat 2.725 K; the 0.010 K difference is negligible
  # against the 0.91 K zero-level uncertainty, but consistency is free.
  remove_cmb_monopole: true

  # Blocker 2 substitute for the truth-informed `covA = (0.1 * true_s)**2`.
  #
  # ** READ THIS BEFORE TRUSTING A RECOVERED GAIN. **  Berkhuijsen (1972) at
  # 820 MHz is the only genuinely Haslam-independent basis, and it is not in
  # hand.  The default below, GSM2008, is NOT independent: it is built from a
  # set of surveys that includes Haslam 408 MHz, and at 408 MHz its
  # reconstruction is dominated by it -- notebooks/02 measures a log-space
  # correlation of 0.993 and a median ratio of 1.005 -- so a GSM2008 prior on
  # the true sky is a Haslam prior in all but name.  Stage 2 records
  # `prior_is_haslam_derived` in its manifest and
  # refuses to let that pass silently.  Three sources are implemented:
  #
  #   gsm2008          GSM2008 evaluated at 408 MHz, galactic native.
  #                    Circular (see above).  Unblocks stages 3-5 as a dry run.
  #   tris_stage1      Stage 1's TRIS maps extrapolated to 408 MHz.  Genuinely
  #                    Haslam-independent -- TRIS is an absolute radiometer --
  #                    but only over the ~52% declination band it observed;
  #                    outside it the prior falls back to a deliberately loose
  #                    width (out_of_band_frac_sigma).
  #   berkhuijsen_1972 The real answer.  Needs paths.berkhuijsen_map.
  #
  # What the sampler actually consumes is covA, a per-pixel VARIANCE with a
  # zero prior mean (gibbs_*.py sets sprior_mean = 0), so the template sets the
  # prior's scale, not its centre.
  prior:
    source: gsm2008               # DECISION -- gsm2008 | tris_stage1 | berkhuijsen_1972
    survey_freq_mhz: 820          # only used by berkhuijsen_1972
    # Spectral index for the survey -> 408 MHz extrapolation only.  It is NOT
    # the beta the sampler infers.
    extrapolation_beta: -2.7
    # Fractional prior width on the template, the stand-in for the paper's 0.1.
    # Widened because a cross-survey extrapolation is looser than a 10% band
    # around the truth.
    frac_sigma: 0.2               # DECISION
    floor_k: 0.5                  # absolute floor on the prior sigma, K
    # tris_stage1 only: prior width outside the TRIS declination band, as a
    # fraction of the local sky.  Deliberately loose -- nothing independent
    # constrains those pixels.
    out_of_band_frac_sigma: 10.0
    # Substitute for the truth-informed gain prior the script builds as
    # covG = (0.15 * (1 + g_true))**2.  With no true gain, g = 0.
    gain_frac_sigma: 0.15

  # Blocker 2 substitute for `nstart=0 -> initialise s0 at the true sky`.
  # There is no truth for real data.  Allowed:
  #   "haslam"     -- initialise at Haslam itself (crude, and NOT circular for
  #                   an initialisation, only for a prior)
  #   "tris_extrap"-- TRIS map extrapolated across pixels
  s0_init: haslam                 # DECISION

  # Gain parametrisation (gameplan stage 2.2).  0 = region-based operator
  # matrix; 1 = spherical-harmonic gain with lmax_gain.  Region-based is the
  # default here because the literature benchmark we validate against in
  # stage 5 (~3% scale, ~0.91 K zero level) is a *scalar* statement, which a
  # small set of regions maps onto directly; alm gains spread it over modes
  # that nothing independently constrains at 2 frequencies.
  op_alm: 0                       # DECISION
  lmax_gain: 5                    # only used when op_alm = 1
  # DECISION -- 12 gain regions, 6 beta regions, following bayesian_skymap's
  # own generator (tests/make_test_data.py: ngain = 12, BETA_REGIONS has 6).
  # An earlier comment here claimed 6 "matches the six regions bayesian_skymap
  # initialises" -- those six are the SPECTRAL INDEX regions, not the gain
  # regions.  The gain deliberately has more freedom than beta.
  n_gain_regions: 12              # only used when op_alm = 0
  n_beta_regions: 6               # must match the length of assemble.beta_init
  # Region geometry.  "theta_bands" is bayesian_skymap's own convention:
  # equal-spaced in colatitude, contiguous in galactic latitude.  "equal_area"
  # splits at equal pixel counts instead, so no gain parameter is carried by a
  # tiny polar band.
  region_geometry: theta_bands    # DECISION -- theta_bands | equal_area

# -----------------------------------------------------------------------------
# Stage 3 -- assembled .npz
# -----------------------------------------------------------------------------
assemble:
  lmax_beam: 150
  freq_beam_mhz: 600              # frequency at which beam_deg is quoted; the
                                  # forward model scales fwhm by freq_beam/freq
  # bayesian_skymap reads `sky_haslam` unconditionally as `true_s`, even with
  # no truth available.  We write the s0_init map into that key and record the
  # substitution in the manifest, so nothing downstream can mistake it for a
  # truth map.  See Blocker 2.
  sky_haslam_is_substitute: true
  # Initial beta per region, the range bayesian_skymap itself initialises.
  beta_init: [-2.5, -2.6, -2.7, -2.8, -2.9, -3.0]

# -----------------------------------------------------------------------------
# Stage 4 -- Gibbs run
# -----------------------------------------------------------------------------
gibbs:
  # DECISION (gameplan 4.1): infer beta jointly -- synchrotron beta is a real
  # unknown here, not a nuisance to fix.
  script: gibbs_spectral_nside.py
  ntimes: 200                     # Gibbs iterations
  nstart: 0                       # 0 = fresh start (s0 from haslam.s0_init)
  file_s0: none                   # checkpoint to resume from when nstart > 0
  nwalkers: 20                    # emcee walkers for the beta step
  nsample: 2500                     # emcee samples per Gibbs iteration

  # Noise levels.  bayesian_skymap parses these as INTEGER mK.
  # sig1 = TRIS map noise: 66 mK systematic + 18 mK statistical at 600 MHz,
  #        added in quadrature = 68.4 mK -> 68.
  sig1_mk: 68                     # DECISION
  # sig2 = Haslam: the 0.91 K zero-level uncertainty from the EDGES-based
  #        analysis dominates the 3% scale error over most of the sky.
  sig2_mk: 910                    # DECISION
  sig3_mk: null                   # confusion noise; null -> script reuses sig2

  # Blocker 3: the Woodbury fast path is wrong by ~8 orders of magnitude at 2
  # channels (dropped cross-frequency coupling) and TRIS gives 2.  Never on.
  use_woodbury: false             # DECISION -- do not flip this on
  # The two documented fixes.  cgs is documented to diverge on this operator;
  # hp.smoothing without iter=0 introduces the asymmetry that makes it diverge.
  solver: gmres                   # DECISION -- gmres, never cgs
  smoothing_iter: 0               # DECISION -- pass iter=0 to both hp.smoothing
  krylov_maxiter: 1000
  krylov_rtol: 1.0e-9

  env:
    # bayesian_skymap reads its inputs from SKYMAP_DATA_DIR and writes to
    # SKYMAP_OUT_DIR; both are set by stage 4 from run.outputs_dir.
    skymap_nside: 128             # exported as SKYMAP_NSIDE

# -----------------------------------------------------------------------------
# Stage 5 -- validation thresholds
# -----------------------------------------------------------------------------
validate:
  # "Did it finish" is not convergence -- this repo's history has silently
  # divergent solves accepted as valid samples.
  require_solver_info_zero: true  # every Krylov solve must report info == 0
  lnprob_burn_in_frac: 0.3
  lnprob_rhat_max: 1.1
  chi2_per_pixel_max: 2.0

  # Literature benchmarks (Sky Map Priors page).  These are sanity checks, not
  # fit targets: a recovered gain far outside them means the pipeline is doing
  # something wrong, not that Haslam is newly interesting.
  gain_scale_expected: 0.03       # ~3% temperature-scale uncertainty
  gain_scale_tolerance: 3.0       # flag if |g| > tol * expected
  zero_level_expected_k: 0.91
  beta_range: [-3.0, -2.5]        # Galactic synchrotron
